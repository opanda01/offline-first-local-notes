version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: chore(deps)
    groups:
      react-native-core:
        patterns:
          - react-native
          - "@react-native/*"
      navigation:
        patterns:
          - "@react-navigation/*"
          - react-native-screens
          - react-native-safe-area-context
          - react-native-pager-view
    ignore:
      - dependency-name: react-native
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-native/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: chore(deps)
